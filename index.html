<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字小世界 - 进阶版</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --wood-light: #e6c88b;
            --wood-dark: #8b5a2b;
            --wood-border: #5c3a1e;
            --pixel-bg: #fffbf0;
            --green-grass: #7cbd59;
            --chat-user: #dceefb;
            --chat-npc: #ffffff;
        }

        * {
            box-sizing: border-box;
            font-family: 'VT323', 'Courier New', monospace;
        }

        body {
            background-color: #f0e6d2; 
            background-image: radial-gradient(#d6c4a0 15%, transparent 16%), radial-gradient(#d6c4a0 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .pixel-box {
            background: var(--wood-light);
            border: 4px solid var(--wood-border);
            box-shadow: 
                inset 4px 4px 0px rgba(255,255,255,0.3),
                inset -4px -4px 0px rgba(0,0,0,0.2),
                0 10px 20px rgba(0,0,0,0.2);
            position: relative;
        }

        #app-container {
            width: 800px;
            height: 600px;
            position: relative;
            background-image: repeating-linear-gradient(45deg, #c29557 25%, #b08446 25%, #b08446 50%, #c29557 50%, #c29557 75%, #b08446 75%, #b08446 100%);
            background-size: 20px 20px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 0;
            left: 0;
            background: rgba(0,0,0,0.6); /*稍微加深背景让文字更清晰*/
            backdrop-filter: blur(4px);
            z-index: 10;
            transition: opacity 0.5s;
        }

        .hidden {
            display: none !important;
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 60px;
            color: #fff;
            text-shadow: 4px 4px 0 #5c3a1e;
            margin-bottom: 10px;
            margin-top: 0;
        }

        .pixel-btn {
            background: #ffcc00;
            border: 4px solid #fff;
            padding: 10px 20px;
            font-size: 24px;
            cursor: pointer;
            color: #5c3a1e;
            text-transform: uppercase;
            box-shadow: 0 6px 0 #b38f00;
            transition: transform 0.1s, box-shadow 0.1s;
            margin: 10px;
            font-weight: bold;
        }

        .pixel-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #b38f00;
        }

        /* 登录框样式 */
        .login-panel {
            background: var(--pixel-bg);
            border: 4px solid var(--wood-border);
            padding: 30px;
            text-align: center;
            border-radius: 8px;
        }

        /* 统计看板样式 */
        .stats-board {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            background: rgba(255,255,255,0.9);
            padding: 20px;
            border-radius: 8px;
            border: 4px solid var(--wood-border);
            margin-bottom: 20px;
            width: 80%;
        }

        .stat-item {
            display: flex;
            align-items: center;
            font-size: 24px;
            color: var(--wood-border);
        }
        
        .stat-icon { font-size: 32px; margin-right: 10px; }

        /* 游戏界面 */
        #game-interface {
            display: flex;
            height: 100%;
            padding: 20px;
            gap: 20px;
        }

        #visual-area {
            flex: 1;
            background: var(--green-grass);
            border: 4px solid var(--wood-border);
            border-radius: 4px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #visual-content {
            font-size: 80px;
            transition: all 0.5s;
        }
        
        .visual-label {
            position: absolute;
            bottom: 10px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 18px;
            text-align: center;
        }

        #chat-area {
            flex: 2;
            display: flex;
            flex-direction: column;
            background: var(--pixel-bg);
            border: 4px solid var(--wood-border);
            border-radius: 4px;
            padding: 10px;
        }

        #chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            align-items: flex-start;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.npc { align-self: flex-start; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }

        .avatar {
            width: 40px;
            height: 40px;
            background: #ddd;
            border: 2px solid #000;
            margin: 0 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border-radius: 4px;
        }

        .bubble {
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 20px;
            line-height: 1.4;
            position: relative;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
        }

        .npc .bubble { background: var(--chat-npc); border: 2px solid #ccc; }
        .user .bubble { background: var(--chat-user); border: 2px solid #add8e6; }

        #input-container {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 2px dashed #ccc;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            font-size: 20px;
            border: 2px solid var(--wood-border);
            background: #fff;
            outline: none;
        }

        #send-btn { padding: 5px 20px; font-size: 20px; }

        #reward-toast {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            border: 3px solid #ffcc00;
            padding: 15px 30px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 100;
            animation: slideDown 0.5s ease;
        }
        
        @keyframes slideDown {
            from { top: -100px; }
            to { top: 20px; }
        }

        .typing-indicator {
            font-style: italic;
            color: #888;
            font-size: 16px;
            margin-left: 60px;
        }

        /* 历史记录按钮 */
        .history-btn-small {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 16px;
            padding: 5px 10px;
        }
    </style>
</head>
<body>

<div id="app-container" class="pixel-box">
    
    <div id="login-screen" class="screen">
        <h1>文字小世界</h1>
        <div class="login-panel">
            <div style="font-size: 60px; margin-bottom: 20px;">📘</div>
            <h3>请输入你的名字开启存档：</h3>
            <input type="text" id="username-input" placeholder="例如：小明" style="width: 200px; text-align: center;">
            <br>
            <button class="pixel-btn" onclick="handleLogin()">开始冒险</button>
        </div>
    </div>

    <div id="home-screen" class="screen hidden">
        <h2 id="welcome-msg" style="color: white; text-shadow: 2px 2px 0 #000;">你好！</h2>
        
        <div class="stats-board">
            <div class="stat-item"><span class="stat-icon">🦸</span> 已结识人物: <span id="stat-people">0</span></div>
            <div class="stat-item"><span class="stat-icon">🌻</span> 培育植物: <span id="stat-plants">0</span></div>
            <div class="stat-item"><span class="stat-icon">🏞️</span> 探索地图: <span id="stat-maps">0</span></div>
            <div class="stat-item"><span class="stat-icon">🏰</span> 建造设施: <span id="stat-builds">0</span></div>
        </div>

        <button class="pixel-btn" onclick="goToSelection()">开始新创作</button>
        <button class="pixel-btn" style="background:#ddd; font-size: 18px;" onclick="logout()">退出/切换账号</button>
    </div>

    <div id="selection-screen" class="screen hidden">
        <button class="pixel-btn history-btn-small" onclick="goHome()">返回主页</button>
        <div class="pixel-box" style="padding: 20px; background: white; text-align: center; border-radius: 8px;">
            <div style="font-size: 50px;">🧚‍♂️</div>
            <h2>你今天想完成怎样的文字任务？</h2>
        </div>
        <div style="display: flex; flex-wrap: wrap; justify-content: center; margin-top: 30px;">
            <button class="pixel-btn" onclick="startTask('people')">🧑‍🤝‍🧑 写人类：猜猜他是谁</button>
            <button class="pixel-btn" onclick="startTask('observation')">🌱 观察类：缤纷世界</button>
            <button class="pixel-btn" onclick="startTask('scenery')">🌄 写景类：这儿真美</button>
            <button class="pixel-btn" onclick="startTask('idea')">💡 想法类：我有一个想法</button>
        </div>
    </div>

    <div id="game-interface" class="hidden">
        <div id="visual-area">
            <div id="visual-content">❓</div>
            <div id="visual-label" class="visual-label">等待任务开始...</div>
        </div>

        <div id="chat-area">
            <div id="chat-history"></div>
            <div id="typing" class="typing-indicator hidden">精灵正在思考...</div>
            <div id="input-container">
                <input type="text" id="user-input" placeholder="输入你的回答..." onkeypress="handleKeyPress(event)">
                <button id="send-btn" class="pixel-btn" onclick="sendMessage()">发送</button>
            </div>
        </div>
        
        <button class="pixel-btn history-btn-small" onclick="quitTask()">保存并退出</button>
    </div>

    <div id="reward-toast" class="hidden">
        <span id="reward-icon" style="font-size: 30px;">🎁</span>
        <span id="reward-text">恭喜获得新物品！</span>
    </div>

</div>

<script>
    // --- 配置 ---
    const API_KEY = 'sk-a8d5cef165e34c2eb48f70d924db43e3';
    const API_URL = 'https://api.deepseek.com/chat/completions';

    // --- 全局变量 ---
    let currentUser = null;
    let userData = {}; // 存放当前用户的所有数据
    let currentTask = null;
    let messageHistory = [];
    let progressStep = 0;

    const SYSTEM_PROMPT_BASE = `
        你是一个小学三年级作文引导游戏中的引导精灵。
        你的任务是通过提问和简要提示，引导学生一步一步完成作文构思。
        你不是作文作者，而是写作过程中的陪伴者与引导者。
        你不能：替学生写出句子或段落、直接给出完整或半完整的作文示例。
        你只能：提出引导性问题、提供写作方向或思路提示、给出简短积极鼓励性的反馈、提供全维度的形容词供选择。
        你的每一次回复必须是：一个清晰的问题 或 一个简短的写作引导提示。
        每次只推进一个写作步骤。使用贴近小学三年级学生理解水平的语言。不对学生内容进行价值评判。
    `;

    const PROMPTS = {
        people: `
            【任务：写人类 - 猜猜他是谁】
            引导顺序：
            1. 确定要写的人是谁
            2. 选择一个最明显的外貌特点
            3.选择一个最明显的性格特点
            4. 回忆一件能体现这个性格特点的小事
            5. 补充事情中的具体细节
            6.与人物相处时的感受或对该人物的情感
            禁止行为：替学生概括人物特点、对人物进行评价性总结。
        `,
        observation: `
            【任务：观察记录类 - 我们眼中缤纷的世界】
            引导顺序：
            1. 明确观察对象
            2. 回忆观察的时间和过程
            3. 描述观察到的变化或现象
            4. 补充观察时的感受或发现
            禁止行为：提供感官描写词语作为示例、替学生总结观察结论。
        `,
        scenery: `
            【任务：描写景物类 - 这儿真美】
            引导顺序：
            1. 确定描写的地点
            2. 回忆地点中看到的事物
            3. 选择一到两处重点进行描写
            4. 表达对这个地方的整体感受
            禁止行为：使用比喻或景物描写范句、替学生组织完整段落。
        `,
        idea: `
            【任务：表达想法类 - 我有一个想法】
            引导顺序：
            1. 发现并说明一个问题
            2. 描述问题出现的具体情境
            3. 表达自己的想法或感受
            4. 提出简单的改进建议
            禁止行为：使用议论文结构术语、总结学生观点。
        `
    };

    // --- 数据库/存档逻辑 (LocalStorage) ---
    
    function handleLogin() {
        const input = document.getElementById('username-input');
        const name = input.value.trim();
        if(!name) return alert("请输入名字哦！");
        
        currentUser = name;
        loadUserData(name);
        
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('home-screen').classList.remove('hidden');
        updateHomeUI();
    }

    function loadUserData(username) {
        const key = 'textworld_user_' + username;
        const saved = localStorage.getItem(key);
        if (saved) {
            userData = JSON.parse(saved);
        } else {
            // 新用户初始化
            userData = {
                username: username,
                stats: { people: 0, plants: 0, maps: 0, builds: 0 },
                history: [] // 存储过去的对话记录
            };
        }
    }

    function saveUserData() {
        if (!currentUser) return;
        const key = 'textworld_user_' + currentUser;
        localStorage.setItem(key, JSON.stringify(userData));
    }

    function logout() {
        currentUser = null;
        userData = {};
        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById('login-screen').classList.remove('hidden');
        document.getElementById('username-input').value = '';
    }

    function updateHomeUI() {
        document.getElementById('welcome-msg').textContent = `你好，${currentUser}！`;
        document.getElementById('stat-people').textContent = userData.stats.people;
        document.getElementById('stat-plants').textContent = userData.stats.plants;
        document.getElementById('stat-maps').textContent = userData.stats.maps;
        document.getElementById('stat-builds').textContent = userData.stats.builds;
    }

    // --- 界面导航 ---
    function goHome() {
        document.getElementById('selection-screen').classList.add('hidden');
        document.getElementById('game-interface').classList.add('hidden');
        document.getElementById('home-screen').classList.remove('hidden');
        updateHomeUI();
    }

    function goToSelection() {
        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById('selection-screen').classList.remove('hidden');
    }

    // 强行退出当前任务
    function quitTask() {
        if(confirm("确定要退出吗？当前的对话会被保存。")) {
            saveCurrentChatToHistory(false); // 保存但不算完成任务
            goHome();
        }
    }

    function startTask(taskType) {
        currentTask = taskType;
        progressStep = 0;
        messageHistory = [];

        updateVisuals(0);

        document.getElementById('selection-screen').classList.add('hidden');
        document.getElementById('game-interface').classList.remove('hidden');
        document.getElementById('chat-history').innerHTML = ''; 

        const fullPrompt = SYSTEM_PROMPT_BASE + PROMPTS[taskType];
        messageHistory.push({ role: "system", content: fullPrompt });

        let greeting = "";
        if(taskType === 'people') greeting = "欢迎来到【人物小镇】！我们来玩《猜猜他是谁》。你想写的是谁呀？";
        if(taskType === 'observation') greeting = "欢迎来到【缤纷种植园】！你要观察什么有趣的事物吗？";
        if(taskType === 'scenery') greeting = "欢迎来到【风景画廊】！你想写的是哪个美丽的地方？";
        if(taskType === 'idea') greeting = "欢迎来到【奇思妙想屋】！最近有一件什么事让你一直在想？";

        addMessage('npc', greeting);
        messageHistory.push({ role: "assistant", content: greeting });
    }

    function addMessage(role, text) {
        const historyDiv = document.getElementById('chat-history');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}`;
        
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = role === 'npc' ? '🧚‍♂️' : '🧑‍🎓';

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;

        msgDiv.appendChild(avatar);
        msgDiv.appendChild(bubble);
        historyDiv.appendChild(msgDiv);
        historyDiv.scrollTop = historyDiv.scrollHeight;
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;

        addMessage('user', text);
        input.value = '';

        if (text.includes("再见") || text.includes("拜拜")) {
            finishTask(); // 正常完成
            return;
        }

        messageHistory.push({ role: "user", content: text });
        document.getElementById('typing').classList.remove('hidden');

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: "deepseek-chat",
                    messages: messageHistory,
                    temperature: 0.7,
                    max_tokens: 150
                })
            });

            const data = await response.json();
            const aiText = data.choices[0].message.content;

            document.getElementById('typing').classList.add('hidden');
            addMessage('npc', aiText);
            messageHistory.push({ role: "assistant", content: aiText });

            progressStep++;
            triggerReward(false);

        } catch (error) {
            console.error(error);
            document.getElementById('typing').classList.add('hidden');
            addMessage('npc', "哎呀，精灵掉线了... (API Error)");
        }
    }

    // --- 任务结算与存档核心 ---
    function finishTask() {
        progressStep = 999; 
        updateVisuals(progressStep);
        addMessage('npc', "真棒！构思完成！文字世界已记录你的创作！再见！👋");
        
        // 1. 更新统计数据 (成就)
        if (currentTask === 'people') userData.stats.people++;
        if (currentTask === 'observation') userData.stats.plants++;
        if (currentTask === 'scenery') userData.stats.maps++;
        if (currentTask === 'idea') userData.stats.builds++;

        // 2. 保存本次对话记录
        saveCurrentChatToHistory(true);

        // 3. 写入 LocalStorage
        saveUserData();

        const toast = document.getElementById('reward-toast');
        document.getElementById('reward-icon').textContent = '🏆';
        document.getElementById('reward-text').textContent = '任务完成！成就已更新！';
        toast.classList.remove('hidden');

        setTimeout(() => {
            toast.classList.add('hidden');
            goHome(); // 返回带统计的主页
        }, 3000);
    }

    function saveCurrentChatToHistory(isCompleted) {
        // 将当前的 messageHistory 存入 userData.history
        const log = {
            id: Date.now(),
            date: new Date().toLocaleString(),
            taskType: currentTask,
            completed: isCompleted,
            messages: messageHistory.slice(1) // 去掉 system prompt
        };
        userData.history.push(log);
        saveUserData(); // 立即保存
    }

    function triggerReward(isFinal) {
        updateVisuals(progressStep);
        const toast = document.getElementById('reward-toast');
        const toastIcon = document.getElementById('reward-icon');
        const toastText = document.getElementById('reward-text');
        
        toast.classList.remove('hidden');
        
        if (currentTask === 'people') { toastIcon.textContent = '🧍'; toastText.textContent = '人物形象更加清晰了！'; } 
        else if (currentTask === 'observation') { toastIcon.textContent = '🌿'; toastText.textContent = '植物正在茁壮成长！'; } 
        else if (currentTask === 'scenery') { toastIcon.textContent = '🗺️'; toastText.textContent = '迷雾正在散去...'; } 
        else if (currentTask === 'idea') { toastIcon.textContent = '🔨'; toastText.textContent = '设施建设进度增加！'; }

        setTimeout(() => { toast.classList.add('hidden'); }, 3000);
    }

    function updateVisuals(step) {
        const content = document.getElementById('visual-content');
        const label = document.getElementById('visual-label');
        const area = document.getElementById('visual-area');
        
        area.className = ''; 
        area.style.background = '#7cbd59';
        content.style.filter = 'none';

        if (step === 999) {
            if (currentTask === 'people') { content.textContent = '🦸'; label.textContent = '人物创作完成！'; }
            if (currentTask === 'observation') { content.textContent = '🌻'; label.textContent = '植物完全盛开！'; }
            if (currentTask === 'scenery') { content.textContent = '🏞️'; label.textContent = '美景尽收眼底！'; }
            if (currentTask === 'idea') { content.textContent = '🏰'; label.textContent = '宏伟的建筑落成了！'; }
            return;
        }

        if (currentTask === 'people') {
            const stages = ['👶', '🧒', '👦', '🧑', '👨‍🏫', '🦸'];
            let index = Math.min(step, stages.length - 1);
            content.textContent = stages[index];
            label.textContent = `人物清晰度：Lv.${index + 1}`;
        } 
        else if (currentTask === 'observation') {
            const plants = ['🌰', '🌱', '🌿', '🌳', '🍎', '🥧'];
            let index = Math.min(step, plants.length - 1);
            content.textContent = plants[index];
            label.textContent = `生长阶段 ${index}`;
        }
        else if (currentTask === 'scenery') {
            content.textContent = '🏞️';
            let blurLevel = Math.max(0, 20 - step * 4);
            content.style.filter = `blur(${blurLevel}px)`;
            label.textContent = step < 3 ? "隐约可见..." : "景色宜人！";
        }
        else if (currentTask === 'idea') {
            const tools = ['📜', '✏️', '🔨', '🏗️', '🏰'];
            let index = Math.min(step, tools.length - 1);
            content.textContent = tools[index];
            label.textContent = `建设进度：${index}`;
            area.style.background = '#a0522d'; 
        }
    }
</script>

</body>
</html>
