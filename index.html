<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字小世界</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --wood-light: #e6c88b;
            --wood-dark: #8b5a2b;
            --wood-border: #5c3a1e;
            --pixel-bg: #fffbf0;
            --green-grass: #7cbd59;
            --chat-user: #dceefb;
            --chat-npc: #ffffff;
        }

        * {
            box-sizing: border-box;
            font-family: 'VT323', 'Courier New', monospace;
        }

        body {
            /* 【修改点1】背景颜色改为浅色 */
            background-color: #f0e6d2; 
            /* 加一点可爱的背景纹理 */
            background-image: radial-gradient(#d6c4a0 15%, transparent 16%), radial-gradient(#d6c4a0 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .pixel-box {
            background: var(--wood-light);
            border: 4px solid var(--wood-border);
            box-shadow: 
                inset 4px 4px 0px rgba(255,255,255,0.3),
                inset -4px -4px 0px rgba(0,0,0,0.2),
                0 10px 20px rgba(0,0,0,0.2); /* 增加一点外部阴影 */
            position: relative;
        }

        #app-container {
            width: 800px;
            height: 600px;
            position: relative;
            background-image: repeating-linear-gradient(45deg, #c29557 25%, #b08446 25%, #b08446 50%, #c29557 50%, #c29557 75%, #b08446 75%, #b08446 100%);
            background-size: 20px 20px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 0;
            left: 0;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(2px);
            z-index: 10;
            transition: opacity 0.5s;
        }

        .hidden {
            display: none !important;
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 60px;
            color: #fff;
            text-shadow: 4px 4px 0 #5c3a1e; /* 字体描边颜色加深，增加对比度 */
            margin-bottom: 20px;
        }

        .pixel-btn {
            background: #ffcc00;
            border: 4px solid #fff;
            padding: 15px 30px;
            font-size: 24px;
            cursor: pointer;
            color: #5c3a1e;
            text-transform: uppercase;
            box-shadow: 0 6px 0 #b38f00;
            transition: transform 0.1s, box-shadow 0.1s;
            margin: 10px;
            font-weight: bold;
        }

        .pixel-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #b38f00;
        }

        #game-interface {
            display: flex;
            height: 100%;
            padding: 20px;
            gap: 20px;
        }

        #visual-area {
            flex: 1;
            background: var(--green-grass);
            border: 4px solid var(--wood-border);
            border-radius: 4px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #visual-content {
            font-size: 80px;
            transition: all 0.5s;
        }
        
        .visual-label {
            position: absolute;
            bottom: 10px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 18px;
            text-align: center;
        }

        #chat-area {
            flex: 2;
            display: flex;
            flex-direction: column;
            background: var(--pixel-bg);
            border: 4px solid var(--wood-border);
            border-radius: 4px;
            padding: 10px;
        }

        #chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            align-items: flex-start;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.npc {
            align-self: flex-start;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: #ddd;
            border: 2px solid #000;
            margin: 0 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border-radius: 4px;
        }

        .bubble {
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 20px;
            line-height: 1.4;
            position: relative;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
        }

        .npc .bubble {
            background: var(--chat-npc);
            border: 2px solid #ccc;
        }

        .user .bubble {
            background: var(--chat-user);
            border: 2px solid #add8e6;
        }

        #input-container {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 2px dashed #ccc;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            font-size: 20px;
            border: 2px solid var(--wood-border);
            background: #fff;
            outline: none;
        }

        #send-btn {
            padding: 5px 20px;
            font-size: 20px;
        }

        #reward-toast {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            border: 3px solid #ffcc00;
            padding: 15px 30px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 100;
            animation: slideDown 0.5s ease;
        }
        
        @keyframes slideDown {
            from { top: -100px; }
            to { top: 20px; }
        }

        .typing-indicator {
            font-style: italic;
            color: #888;
            font-size: 16px;
            margin-left: 60px;
        }
    </style>
</head>
<body>

<div id="app-container" class="pixel-box">
    
    <div id="home-screen" class="screen">
        <h1>文字小世界</h1>
        <div style="font-size: 80px; margin-bottom: 20px;">🏡</div>
        <button class="pixel-btn" onclick="goToSelection()">进入文字世界</button>
    </div>

    <div id="selection-screen" class="screen hidden">
        <div class="pixel-box" style="padding: 20px; background: white; text-align: center; border-radius: 8px;">
            <div style="font-size: 50px;">🧚‍♂️</div>
            <h2>你今天想完成怎样的文字任务？</h2>
        </div>
        <div style="display: flex; flex-wrap: wrap; justify-content: center; margin-top: 30px;">
            <button class="pixel-btn" onclick="startTask('people')">🧑‍🤝‍🧑 写人类：猜猜他是谁</button>
            <button class="pixel-btn" onclick="startTask('observation')">🌱 观察类：缤纷世界</button>
            <button class="pixel-btn" onclick="startTask('scenery')">🌄 写景类：这儿真美</button>
            <button class="pixel-btn" onclick="startTask('idea')">💡 想法类：我有一个想法</button>
        </div>
    </div>

    <div id="game-interface" class="hidden">
        <div id="visual-area">
            <div id="visual-content">❓</div>
            <div id="visual-label" class="visual-label">等待任务开始...</div>
        </div>

        <div id="chat-area">
            <div id="chat-history"></div>
            <div id="typing" class="typing-indicator hidden">精灵正在思考...</div>
            <div id="input-container">
                <input type="text" id="user-input" placeholder="输入你的回答..." onkeypress="handleKeyPress(event)">
                <button id="send-btn" class="pixel-btn" onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>

    <div id="reward-toast" class="hidden">
        <span id="reward-icon" style="font-size: 30px;">🎁</span>
        <span id="reward-text">恭喜获得新物品！</span>
    </div>

</div>

<script>
    // --- 配置 ---
    const API_KEY = 'sk-a8d5cef165e34c2eb48f70d924db43e3';
    const API_URL = 'https://api.deepseek.com/chat/completions';

    // --- 全局状态 ---
    let currentTask = null;
    let messageHistory = [];
    let progressStep = 0;

    // --- Prompt 数据 ---
    const SYSTEM_PROMPT_BASE = `
        你是一个小学三年级作文引导游戏中的引导精灵。
        你的任务是通过提问和简要提示，引导学生一步一步完成作文构思。
        你不是作文作者，而是写作过程中的陪伴者与引导者。
        你不能：替学生写出句子或段落、直接给出完整或半完整的作文示例。
        你只能：提出引导性问题、提供写作方向或思路提示、给出简短积极鼓励性的反馈、提供全维度的形容词供选择。
        你的每一次回复必须是：一个清晰的问题 或 一个简短的写作引导提示。
        每次只推进一个写作步骤。使用贴近小学三年级学生理解水平的语言。不对学生内容进行价值评判。
    `;

    const PROMPTS = {
        people: `
            【任务：写人类 - 猜猜他是谁】
            引导顺序：
            1. 确定要写的人是谁
            2. 选择一个最明显的外貌特点
            3.选择一个最明显的性格特点
            4. 回忆一件能体现这个性格特点的小事
            5. 补充事情中的具体细节
            6.与人物相处时的感受或对该人物的情感
            禁止行为：替学生概括人物特点、对人物进行评价性总结。
        `,
        observation: `
            【任务：观察记录类 - 我们眼中缤纷的世界】
            引导顺序：
            1. 明确观察对象
            2. 回忆观察的时间和过程
            3. 描述观察到的变化或现象
            4. 补充观察时的感受或发现
            禁止行为：提供感官描写词语作为示例、替学生总结观察结论。
        `,
        scenery: `
            【任务：描写景物类 - 这儿真美】
            引导顺序：
            1. 确定描写的地点
            2. 回忆地点中看到的事物
            3. 选择一到两处重点进行描写
            4. 表达对这个地方的整体感受
            禁止行为：使用比喻或景物描写范句、替学生组织完整段落。
        `,
        idea: `
            【任务：表达想法类 - 我有一个想法】
            引导顺序：
            1. 发现并说明一个问题
            2. 描述问题出现的具体情境
            3. 表达自己的想法或感受
            4. 提出简单的改进建议
            禁止行为：使用议论文结构术语、总结学生观点。
        `
    };

    // --- 界面导航 ---
    function goToSelection() {
        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById('selection-screen').classList.remove('hidden');
    }

    function startTask(taskType) {
        currentTask = taskType;
        progressStep = 0;
        messageHistory = [];

        // 初始化视觉区
        updateVisuals(0);

        document.getElementById('selection-screen').classList.add('hidden');
        document.getElementById('game-interface').classList.remove('hidden');
        document.getElementById('chat-history').innerHTML = ''; // 清空聊天记录

        const fullPrompt = SYSTEM_PROMPT_BASE + PROMPTS[taskType];
        messageHistory.push({ role: "system", content: fullPrompt });

        let greeting = "";
        if(taskType === 'people') greeting = "欢迎来到【人物小镇】！我们来玩《猜猜他是谁》。你想写的是谁呀？";
        if(taskType === 'observation') greeting = "欢迎来到【缤纷种植园】！你要观察什么有趣的事物吗？";
        if(taskType === 'scenery') greeting = "欢迎来到【风景画廊】！你想写的是哪个美丽的地方？";
        if(taskType === 'idea') greeting = "欢迎来到【奇思妙想屋】！最近有一件什么事让你一直在想？";

        addMessage('npc', greeting);
        messageHistory.push({ role: "assistant", content: greeting });
    }

    function addMessage(role, text) {
        const historyDiv = document.getElementById('chat-history');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}`;
        
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = role === 'npc' ? '🧚‍♂️' : '🧑‍🎓';

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;

        msgDiv.appendChild(avatar);
        msgDiv.appendChild(bubble);
        historyDiv.appendChild(msgDiv);
        historyDiv.scrollTop = historyDiv.scrollHeight;
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;

        // 1. 显示用户消息
        addMessage('user', text);
        input.value = '';

        // 【修改点3】检测 "再见" 逻辑
        if (text.includes("再见") || text.includes("拜拜")) {
            // 触发通关逻辑
            finishTask();
            return; // 不再调用 API
        }

        messageHistory.push({ role: "user", content: text });

        // 2. 显示加载中
        document.getElementById('typing').classList.remove('hidden');

        // 3. 调用 DeepSeek API
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: "deepseek-chat",
                    messages: messageHistory,
                    temperature: 0.7,
                    max_tokens: 150
                })
            });

            const data = await response.json();
            const aiText = data.choices[0].message.content;

            document.getElementById('typing').classList.add('hidden');
            addMessage('npc', aiText);
            messageHistory.push({ role: "assistant", content: aiText });

            // 触发正常奖励
            progressStep++;
            triggerReward(false);

        } catch (error) {
            console.error(error);
            document.getElementById('typing').classList.add('hidden');
            addMessage('npc', "哎呀，精灵掉线了... (API Error)");
        }
    }

    // --- 任务完成/退出逻辑 ---
    function finishTask() {
        // 强制显示最终形态
        progressStep = 999; 
        updateVisuals(progressStep);
        
        // 精灵回复
        addMessage('npc', "真棒！你的构思已经完成了。文字世界因为你的创作变得更丰富了！再见！👋");
        
        // 显示大奖励
        const toast = document.getElementById('reward-toast');
        document.getElementById('reward-icon').textContent = '🏆';
        document.getElementById('reward-text').textContent = '任务完美完成！';
        toast.classList.remove('hidden');

        // 3秒后返回主页
        setTimeout(() => {
            toast.classList.add('hidden');
            document.getElementById('game-interface').classList.add('hidden');
            document.getElementById('selection-screen').classList.remove('hidden');
            // 重置
            progressStep = 0;
            currentTask = null;
        }, 3000);
    }

    function triggerReward(isFinal) {
        updateVisuals(progressStep);
        const toast = document.getElementById('reward-toast');
        const toastIcon = document.getElementById('reward-icon');
        const toastText = document.getElementById('reward-text');
        
        toast.classList.remove('hidden');
        
        if (currentTask === 'people') {
            toastIcon.textContent = '🧍';
            toastText.textContent = '人物形象更加清晰了！';
        } else if (currentTask === 'observation') {
            toastIcon.textContent = '🌿';
            toastText.textContent = '植物正在茁壮成长！';
        } else if (currentTask === 'scenery') {
            toastIcon.textContent = '🗺️';
            toastText.textContent = '迷雾正在散去...';
        } else if (currentTask === 'idea') {
            toastIcon.textContent = '🔨';
            toastText.textContent = '设施建设进度增加！';
        }

        setTimeout(() => {
            toast.classList.add('hidden');
        }, 3000);
    }

    function updateVisuals(step) {
        const content = document.getElementById('visual-content');
        const label = document.getElementById('visual-label');
        const area = document.getElementById('visual-area');
        
        area.className = ''; 
        area.style.background = '#7cbd59';
        content.style.filter = 'none';

        // 最终完成状态 (step 999)
        if (step === 999) {
            if (currentTask === 'people') { content.textContent = '🦸'; label.textContent = '人物创作完成！'; }
            if (currentTask === 'observation') { content.textContent = '🌻'; label.textContent = '植物完全盛开！'; }
            if (currentTask === 'scenery') { content.textContent = '🏞️'; label.textContent = '美景尽收眼底！'; }
            if (currentTask === 'idea') { content.textContent = '🏰'; label.textContent = '宏伟的建筑落成了！'; }
            return;
        }

        if (currentTask === 'people') {
            // 【修改点2】小动物改成人物形象
            // 婴儿 -> 幼儿 -> 少年 -> 青年 -> 职业者 -> 英雄
            const stages = ['👶', '🧒', '👦', '🧑', '👨‍🏫', '🦸'];
            let index = Math.min(step, stages.length - 1);
            content.textContent = stages[index];
            label.textContent = `人物清晰度：Lv.${index + 1}`;
        } 
        else if (currentTask === 'observation') {
            const plants = ['🌰', '🌱', '🌿', '🌳', '🍎', '🥧'];
            let index = Math.min(step, plants.length - 1);
            content.textContent = plants[index];
            label.textContent = `生长阶段 ${index}`;
        }
        else if (currentTask === 'scenery') {
            content.textContent = '🏞️';
            let blurLevel = Math.max(0, 20 - step * 4);
            content.style.filter = `blur(${blurLevel}px)`;
            
            if (step === 0) label.textContent = "一片迷雾...";
            else if (step < 3) label.textContent = "隐约可见...";
            else label.textContent = "景色宜人！";
        }
        else if (currentTask === 'idea') {
            const tools = ['📜', '✏️', '🔨', '🏗️', '🏰'];
            let index = Math.min(step, tools.length - 1);
            content.textContent = tools[index];
            label.textContent = `建设进度：${index}`;
            area.style.background = '#a0522d'; 
        }
    }
</script>

</body>
</html>
